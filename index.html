<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Sissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ROCK PAPER SISSORS</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="2.jpg">
        </div>
        <div class="choice" id="paper">
            <img src="1.jpg">
        </div>
        <div class="choice" id="sissor">
            <img src="3.jpg">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>
        </div> 
        <div class="score">
            <p id="comp-score">0</p>
            <p>comp</p>
        </div>
        <div class="score">
            <p id="draw-score">0</p>
            <p>Draw</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your Move</p>
    </div>  
    
    <div class="reset-button">
        <button class="reset-button1">Reset Game</button>
    </div>
<script src="first.js"></script>
</body>
</html>
